services:

  spark-master:
    image: spark:4.2.0-scala2.13-java17-python3-ubuntu
    container_name: da3408-spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output
      - ../../logs:/workspace/logs
    networks:
      - spark-net

  spark-worker-1:
    image: spark:4.2.0-scala2.13-java17-python3-ubuntu
    container_name: da3408-spark-worker-1
    hostname: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 5
      --memory 3G
      --webui-port 8081
    ports:
      - "8081:8081"
    volumes:
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output
      - ../../logs:/workspace/logs
    networks:
      - spark-net
    depends_on:
      - spark-master

  spark-worker-2:
    image: spark:4.2.0-scala2.13-java17-python3-ubuntu
    container_name: da3408-spark-worker-2
    hostname: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 5
      --memory 3G
      --webui-port 8081
    ports:
      - "8082:8081"
    volumes:
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output
      - ../../logs:/workspace/logs
    networks:
      - spark-net
    depends_on:
      - spark-master

networks:
  spark-net:
    driver: bridge
