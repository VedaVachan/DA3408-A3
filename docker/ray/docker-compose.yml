services:
  ray-head:
    image: rayproject/ray:2.59.0-py311
    container_name: da3408-ray-head
    hostname: ray-head
    command: >
      ray start --head
      --node-ip-address=0.0.0.0
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --block
    ports:
      - "6379:6379"
      - "8265:8265"
    volumes:
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output
      - ../../logs:/workspace/logs
    networks:
      - ray-net

  ray-worker-1:
    image: rayproject/ray:2.59.0-py311
    container_name: da3408-ray-worker-1
    hostname: ray-worker-1
    command: >
      ray start
      --address=ray-head:6379
      --num-cpus=4
      --block
    volumes:
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output
      - ../../logs:/workspace/logs
    networks:
      - ray-net
    depends_on:
      - ray-head

  ray-worker-2:
    image: rayproject/ray:2.59.0-py311
    container_name: da3408-ray-worker-2
    hostname: ray-worker-2
    command: >
      ray start
      --address=ray-head:6379
      --num-cpus=4
      --block
    volumes:
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output
      - ../../logs:/workspace/logs
    networks:
      - ray-net
    depends_on:
      - ray-head

networks:
  ray-net:
    driver: bridge
