services:

  ray-head:
    image: rayproject/ray:2.59.0-py312-cpu
    container_name: da3408-ray-head
    hostname: ray-head
    shm_size: 1g
    ports:
      - "8265:8265"
      - "6379:6379"
    volumes:
      - ../../:/workspace:ro
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output:rw
      - ../../logs:/workspace/logs:rw
    environment:
      - RAY_DATA_DEFAULT_SHUFFLE_STRATEGY=hash_shuffle_v2
      - RAY_DATA_ENABLE_DISK_SHUFFLE=1
    command: >
      bash -lc "
      ray start --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=0
      --object-store-memory=536870912
      --memory=1073741824
      --block
      "
    networks:
      - ray-net

  ray-worker-1:
    image: rayproject/ray:2.59.0-py312-cpu
    container_name: da3408-ray-worker-1
    hostname: ray-worker-1
    shm_size: 1g
    volumes:
      - ../../:/workspace:ro
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output:rw
      - ../../logs:/workspace/logs:rw
    environment:
      - RAY_DATA_DEFAULT_SHUFFLE_STRATEGY=hash_shuffle_v2
      - RAY_DATA_ENABLE_DISK_SHUFFLE=1
    command: >
      bash -lc "
      ray start
      --address=ray-head:6379
      --num-cpus=5
      --object-store-memory=536870912
      --memory=3221225472
      --block
      "
    depends_on:
      - ray-head
    networks:
      - ray-net

  ray-worker-2:
    image: rayproject/ray:2.59.0-py312-cpu
    container_name: da3408-ray-worker-2
    hostname: ray-worker-2
    shm_size: 1g
    volumes:
      - ../../:/workspace:ro
      - ../../data:/workspace/data:ro
      - ../../output:/workspace/output:rw
      - ../../logs:/workspace/logs:rw
    environment:
      - RAY_DATA_DEFAULT_SHUFFLE_STRATEGY=hash_shuffle_v2
      - RAY_DATA_ENABLE_DISK_SHUFFLE=1
    command: >
      bash -lc "
      ray start
      --address=ray-head:6379
      --num-cpus=5
      --object-store-memory=536870912
      --memory=3221225472
      --block
      "
    depends_on:
      - ray-head
    networks:
      - ray-net

networks:
  ray-net:
    driver: bridge
